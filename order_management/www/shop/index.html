{% extends "templates/web.html" %}

{% block content %}
<div class="om-app">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>

    /*--- om--> Order management styles ---*/
    .om-app{
    width:100%;
    }
 body{
    --ink:#14231c; --paper:#f6f7f2; --panel:#ffffff;
    --forest:#1f7a5c; --forest-dk:#153f2f; --lime:#ddf26d;
    --rust:#b7431a; --line:#e3e6dd; --muted:#5b6a60;
    font-family:'Inter',sans-serif; color:var(--ink); background:var(--paper);
    min-height:100vh;
  }
  .om-app *{box-sizing:border-box;}
  .om-app h1,.om-app h2,.om-app h3{font-family:'Fraunces',serif; letter-spacing:-0.01em;}
  .om-nums{font-family:'IBM Plex Mono',monospace;}
  .web-footer{display:none;}


  .om-brand{display:flex; align-items:center; gap:.6rem; font-weight:700; font-size:1.05rem;}
  .om-brand .dot{width:9px; height:9px; border-radius:50%; background:var(--lime);}
  .om-cart-link{
    position:relative; display:flex; align-items:center; gap:.4rem;
    background:var(--forest); padding:.5rem .9rem; border-radius:999px; color:#fff !important;
  }
  .om-cart-badge{
    background:var(--lime); color:var(--forest-dk); font-weight:700; font-size:.7rem;
    min-width:1.2rem; height:1.2rem; border-radius:50%; display:flex; align-items:center; justify-content:center;
  }

  /* ---- Hero ---- */
  .om-hero{padding:2.2rem 1.5rem 1rem; max-width:1180px; margin:0 auto;}
  .om-hero h1{font-size:2rem; font-weight:700; margin:0 0 .3rem;}
  .om-hero p{color:var(--muted); margin:0; font-size:.95rem;}

  /* ---- Aisle chips ---- */
  .om-aisles{
    display:flex; gap:.6rem; overflow-x:auto; padding:1.2rem 1.5rem;
    max-width:1180px; margin:0 auto; scrollbar-width:none;
  }
  .om-aisles::-webkit-scrollbar{display:none;}
  .om-chip{
    flex-shrink:0; display:flex; align-items:center; gap:.5rem;
    background:var(--panel); border:1px solid var(--line); border-radius:999px;
    padding:.5rem 1rem; font-size:.82rem; font-weight:600; cursor:pointer;
    transition:all .15s; color:var(--ink);
  }
  .om-chip .om-nums{color:var(--muted); font-size:.72rem;}
  .om-chip:hover{border-color:var(--forest);}
  .om-chip.active{background:var(--forest-dk); border-color:var(--forest-dk); color:#fff;}
  .om-chip.active .om-nums{color:var(--lime);}

  /* ---- Grid ---- */
  .om-grid{
    max-width:1180px; margin:0 auto; padding:0 1.5rem 3rem;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:1.1rem;
  }
  .om-card {
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:1rem; display:grid; grid-template-rows:auto auto 1fr auto; gap:.55rem;
    transition:box-shadow .2s, transform .2s;
  }
  .om-card:hover{box-shadow:0 8px 24px rgba(20,35,28,.08); transform:translateY(-2px);}
  .om-card-img{
    position:relative; width:100%; aspect-ratio:1/1; border-radius:10px; overflow:hidden;
    background:linear-gradient(135deg,#eef1e7,#e2e7db); display:flex; align-items:center; justify-content:center;
  }
  .om-card-img img{width:100%; height:100%; object-fit:cover;}
  .om-card-img .ph{font-size:2.2rem;}
  .om-stock-tag{
    position:absolute; top:.5rem; right:.5rem; font-size:.62rem; font-weight:700;
    padding:.2rem .55rem; border-radius:999px; color:#fff;
  }
  .om-stock-tag.in{background:var(--forest);}
  .om-stock-tag.out{background:var(--rust);}
  .om-card-cat{font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--forest); font-weight:700;}
  .om-card-name{font-size:.92rem; font-weight:600; line-height:1.3; min-height:2.4em;}
  .om-card-foot{display:flex; align-items:center; justify-content:space-between; border-top:1px dashed var(--line); padding-top:.6rem;}
  .om-price{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:1.05rem;}
  .om-btn-add{
    background:var(--forest); color:#fff; border:none; font-weight:600; font-size:.78rem;
    padding:.45rem 1rem; border-radius:999px; cursor:pointer; transition:background .15s;
  }
  .om-btn-add:hover{background:var(--forest-dk);}
  .om-btn-out{
    background:var(--paper); color:var(--muted); border:1px solid var(--line);
    font-size:.75rem; font-weight:600; padding:.45rem .8rem; border-radius:999px;
  }
  .om-stepper{display:flex; align-items:center; gap:.5rem; background:#eef5ee; border:1px solid var(--forest); border-radius:999px; padding:.2rem .3rem;}
  .om-stepper button{background:none; border:none; width:1.5rem; height:1.5rem; font-weight:700; color:var(--forest-dk); cursor:pointer;}
  .om-stepper span{font-family:'IBM Plex Mono',monospace; font-weight:600; min-width:1rem; text-align:center;}

  .om-empty{grid-column:1/-1; text-align:center; padding:3rem 0; color:var(--muted);}
  .om-toast{
    position:fixed; bottom:1.2rem; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--forest-dk); color:#fff; padding:.7rem 1.2rem; border-radius:10px;
    font-size:.85rem; opacity:0; transition:all .25s; pointer-events:none; z-index:2000;
  }
  .om-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media(max-width:640px){ .om-hero h1{font-size:1.5rem;} }
</style>


<div class="om-hero">
  <h1>Today's Top picks</h1>
  <p id="om-greeting">Fresh stock, dispatched in minutes.</p>
</div>

<div class="om-aisles" id="om-aisles">
  <button class="om-chip active" data-cat="all"><span class="om-nums"></span> All</button>
</div>

<div class="om-grid" id="om-grid">
  <div class="om-empty">Loading products…</div>
</div>

<div class="om-toast" id="om-toast"></div>
</div>

<script>
frappe.ready(function(){


  var CART_KEY = 'om_cart_v1';
  var cart = JSON.parse(localStorage.getItem(CART_KEY) || '{}');
  var products = [];

  function saveCart(){ localStorage.setItem(CART_KEY, JSON.stringify(cart)); updateCartBadge(); }
  function updateCartBadge(){
    var total = Object.values(cart).reduce(function(s,i){return s+i.qty;}, 0);
    document.getElementById('om-cart-count').innerText = total;
  }
  function toast(msg){
    var t = document.getElementById('om-toast');
    t.innerText = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1600);
  }

  frappe.call({
    method: 'order_management.api.get_current_user_info',
    callback: function(r){
      if (r.message && r.message.logged_in){
        document.getElementById('om-greeting').innerText = 'Welcome back, ' + r.message.first_name + '.';
      }
    }
  });

  frappe.call({
    method: 'order_management.api.products',
    callback: function(r){
      products = r.message || [];
      renderAisles(products);
      renderGrid(products);
      updateCartBadge();
    },
    error: function(){
      document.getElementById('om-grid').innerHTML = '<div class="om-empty">Could not load products. Try refreshing.</div>';
    }
  });

  function renderAisles(items){
    var groups = [];
    items.forEach(function(i){
      var g = i.item_group || 'General';
      if (groups.indexOf(g) === -1) groups.push(g);
    });
    var wrap = document.getElementById('om-aisles');
    groups.forEach(function(g, idx){
      var chip = document.createElement('button');
      chip.className = 'om-chip';
      chip.dataset.cat = g;
      chip.innerHTML = '<span class="om-nums">' + String(idx+1).padStart(2,'0') + '</span> ' + g;
      wrap.appendChild(chip);
    });
    wrap.addEventListener('click', function(e){
      var chip = e.target.closest('.om-chip');
      if (!chip) return;
      wrap.querySelectorAll('.om-chip').forEach(function(c){ c.classList.remove('active'); });
      chip.classList.add('active');
      var cat = chip.dataset.cat;
      document.querySelectorAll('.om-card').forEach(function(card){
        card.style.display = (cat === 'all' || card.dataset.group === cat) ? '' : 'none';
      });
    });
  }

  function renderGrid(items){
    var grid = document.getElementById('om-grid');
    grid.innerHTML = '';
    if (!items.length){
      grid.innerHTML = '<div class="om-empty">No products available right now.</div>';
      return;
    }
    items.forEach(function(item){
      var stock = item.stock !== undefined ? item.stock : 0;
      var name = item.item_name || item.name;
      var price = item.price || 0;
      var card = document.createElement('div');
      card.className = 'om-card';
      card.dataset.group = item.item_group || 'General';
      card.dataset.item = item.name;
      card.innerHTML =
        '<div class="om-card-img">' +
          (item.custom_item_image ? '<img src="'+item.custom_item_image+'" alt="'+name+'">' : '<span class="ph">🌿</span>') +
          '<span class="om-stock-tag ' + (stock>0?'in':'out') + '">' + (stock>0 ? stock+' left' : 'Out') + '</span>' +
        '</div>' +
        '<div class="om-card-cat">' + (item.item_group || 'General') + '</div>' +
        '<div class="om-card-name">' + name + '</div>' +
        '<div class="om-card-foot">' +
          '<span class="om-price">₹' + price.toFixed(2) + '</span>' +
          '<div class="om-action" data-item="'+item.name+'" data-name="'+name+'" data-price="'+price+'" data-stock="'+stock+'">' +
            (stock>0 ? '<button class="om-btn-add">Add</button>' : '<button class="om-btn-out" disabled>Out of stock</button>') +
          '</div>' +
        '</div>';
      grid.appendChild(card);
    });
  }

  document.getElementById('om-grid').addEventListener('click', function(e){
    var action = e.target.closest('.om-action');
    if (!action) return;
    var code = action.dataset.item, name = action.dataset.name;
    var price = parseFloat(action.dataset.price), maxStock = parseInt(action.dataset.stock);

    if (e.target.classList.contains('om-btn-add')){
      cart[code] = cart[code] || { item: code, item_name: name, price: price, qty: 0, maxStock: maxStock };
      cart[code].qty += 1;
      renderStepper(action);
      saveCart();
      toast(name + ' added to cart');
    } else if (e.target.classList.contains('om-step-plus')){
      if (cart[code].qty >= maxStock){ toast('Only ' + maxStock + ' in stock'); return; }
      cart[code].qty += 1; renderStepper(action); saveCart();
    } else if (e.target.classList.contains('om-step-minus')){
      cart[code].qty -= 1;
      if (cart[code].qty <= 0) delete cart[code];
      renderStepper(action); saveCart();
    }
  });

  function renderStepper(action){
    var code = action.dataset.item;
    if (cart[code]){
      action.innerHTML = '<div class="om-stepper"><button class="om-step-minus">−</button><span class="om-nums">'+cart[code].qty+'</span><button class="om-step-plus">+</button></div>';
    } else {
      var stock = parseInt(action.dataset.stock);
      action.innerHTML = stock>0 ? '<button class="om-btn-add">Add</button>' : '<button class="om-btn-out" disabled>Out of stock</button>';
    }
  }
});
</script>
{% endblock %}
